name: Client-Windows-MSVS2022

on:
#  push:
#    branches: [ master ]
#  pull_request:
#    branches: [ master ]
  workflow_dispatch:
    inputs:
      commit:
        description: "Optional commit SHA to build"
        required: false
        default: ""

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit != '' && github.event.inputs.commit || '' }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution (Release / Win32)
        run: |
          msbuild src\wolf.sln /t:Build /p:Configuration="Release" /p:Platform=Win32

      - name: Collect artifacts
        shell: cmd
        run: |
          mkdir wolfse-artifacts
          mkdir wolfse-artifacts\main
          copy /Y src\Release\*.exe wolfse-artifacts\
          copy /Y src\Release\*.dll wolfse-artifacts\main\
          dir wolfse-artifacts
          dir wolfse-artifacts\main

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wolfse-windows-client
          path: wolfse-artifacts
